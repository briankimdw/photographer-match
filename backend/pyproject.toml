# Tool configuration only (dependencies live in requirements*.txt).
# The baseline matches the existing code; tighten it deliberately, not as a side effect.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B904 (raise ... from err) is not followed in existing code.
ignore = ["B904"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
ignore_missing_imports = true
exclude = ['^\.venv/']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
